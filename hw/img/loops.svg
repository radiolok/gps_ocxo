<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" role="img">
  <title>DOROGO: кто что корректирует</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="28" y="38" text-anchor="start" font-size="17" font-weight="700" fill="#1f2328">AD9545 держит частоту выходов, STM32 — время суток в PHC</text>
  <text x="28" y="60" text-anchor="start" font-size="12.5" font-weight="400" fill="#57606a">Петля частоты — аппаратно и непрерывно; петля времени — раз в секунду</text>
  <rect x="28" y="88" width="470" height="488" rx="10" fill="none" stroke="#afb8c1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="44" y="112" text-anchor="start" font-size="13" font-weight="600" fill="#57606a">Петля частоты — AD9545</text>
  <rect x="526" y="88" width="346" height="488" rx="10" fill="none" stroke="#afb8c1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="542" y="112" text-anchor="start" font-size="13" font-weight="600" fill="#57606a">Петля времени — STM32</text>
  <rect x="50.0" y="127.0" width="180" height="66" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.3"/>
  <text x="140" y="149.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">ZED-F9T</text>
  <text x="140" y="166.5" text-anchor="middle" font-size="11.5" fill="#57606a">TP1 → PPS</text>
  <text x="140" y="181.5" text-anchor="middle" font-size="11.5" fill="#57606a">UART → UBX</text>
  <rect x="50.0" y="302.0" width="180" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.3"/>
  <text x="140" y="327.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">OCXO 10 МГц</text>
  <text x="140" y="344.0" text-anchor="middle" font-size="11.5" fill="#57606a">свободный ход</text>
  <rect x="260.0" y="268.0" width="220" height="124" rx="8" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="370" y="304.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">AD9545</text>
  <text x="370" y="321.5" text-anchor="middle" font-size="11.5" fill="#57606a">REF: GNSS PPS</text>
  <text x="370" y="336.5" text-anchor="middle" font-size="11.5" fill="#57606a">sysclk: OCXO</text>
  <text x="370" y="351.5" text-anchor="middle" font-size="11.5" fill="#57606a">DPLL (мГц) → NCO → APLL</text>
  <text x="370" y="366.5" text-anchor="middle" font-size="11.5" fill="#57606a">статус и FTW → SPI3</text>
  <rect x="260.0" y="467.0" width="220" height="66" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.3"/>
  <text x="370" y="489.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Выходы</text>
  <text x="370" y="506.5" text-anchor="middle" font-size="11.5" fill="#57606a">синус 10/5/1, 2 × TTL, PPS</text>
  <text x="370" y="521.5" text-anchor="middle" font-size="11.5" fill="#57606a">25 МГц → HSE STM32 и PHY</text>
  <rect x="590.0" y="132.0" width="220" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.3"/>
  <text x="700" y="157.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">TIM2</text>
  <text x="700" y="174.0" text-anchor="middle" font-size="11.5" fill="#57606a">PA15: PPS · ITR1: PHC</text>
  <rect x="590.0" y="222.0" width="220" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.3"/>
  <text x="700" y="247.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">gnss_ubx</text>
  <text x="700" y="264.0" text-anchor="middle" font-size="11.5" fill="#57606a">номер секунды, UTC, qErr</text>
  <rect x="590.0" y="312.0" width="220" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.3"/>
  <text x="700" y="337.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">phc_servo</text>
  <text x="700" y="354.0" text-anchor="middle" font-size="11.5" fill="#57606a">step один раз, затем addend</text>
  <rect x="590.0" y="402.0" width="220" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.3"/>
  <text x="700" y="427.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">PHC в MAC</text>
  <text x="700" y="444.0" text-anchor="middle" font-size="11.5" fill="#57606a">PTP, NTP, индикатор</text>
  <rect x="590.0" y="492.0" width="220" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.3"/>
  <text x="700" y="517.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">ad9545_ctl</text>
  <text x="700" y="534.0" text-anchor="middle" font-size="11.5" fill="#57606a">профиль, статус, FTW</text>
  <path d="M230 148 L590 148" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/>
  <circle cx="370" cy="148" r="3.2" fill="#8c959f"/>
  <path d="M370 148 L370 268" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="380" y="140" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">GNSS PPS</text>
  <path d="M230 176 L300 176 L300 214 L560 214 L560 250 L590 250" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="310" y="206" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">UBX, USART1</text>
  <path d="M230 330 L260 330" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M700 278 L700 312" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="708" y="300" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">qErr</text>
  <path d="M810 160 L852 160 L852 340 L810 340" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M700 368 L700 402" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M810 430 L862 430 L862 148 L810 148" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="866" y="290" text-anchor="start" font-size="11" font-weight="400" fill="#57606a">ITR1</text>
  <path d="M480 482 L560 482 L560 430 L590 430" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="488" y="474" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">25 МГц</text>
  <path d="M590 520 L540 520 L540 370 L480 370" fill="none" stroke="#8c959f" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="548" y="540" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">SPI3</text>
  <path d="M370 392 L370 467" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arr)"/>
</svg>
